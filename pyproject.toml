[project]
name = "screen-animator"
description = "Python app to generate animated messages and images on a screen, with a focus on the Raspberry Pi."
dynamic = ["version"]
license="MIT"
license-files = ["LICEN[CS]E*"]
authors = [
    { name="Dave Anscombe", email="dave.anski@gmail.com" },
]
readme = "README.md"
repository = "https://github.com/Anski-D/screen-animator"
requires-python = ">=3.13"
dependencies = [
    "cairosvg>=2.7.1",
    "mergedeep>=1.3.4",
    "numpy>=2.1.2",
    "pygame-ce>=2.5.1",
    "svgutils>=0.3.4",
]

[project.scripts]
screen_animator = "screen_animator.__main__:main"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.2",
    "ruff>=0.16.6",
    "tox>=4.60.1",
]
test = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-sugar>=1.1.1",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
